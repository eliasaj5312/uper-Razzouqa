<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario HTML5 Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #gameFrame {
            position: relative;
            width: min(100vw, calc(100vh * 1920 / 1080));
            aspect-ratio: 1920 / 1080;
        }
        #gameFrame canvas,
        #gameFrame #startMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 5px;
        }
        #heartsDisplay {
            position: absolute;
            top: 3%;
            left: 3%;
            z-index: 6;
            display: flex;
            gap: 6px;
        }
        #heartsDisplay .heart {
            width: 26px;
            height: 26px;
            display: inline-block;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        #heartsDisplay .heart img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        #heartsDisplay .heart.lost {
            opacity: 0.25;
            filter: grayscale(1) drop-shadow(0 2px 2px rgba(0,0,0,0.5));
            transform: scale(0.85);
        }
        @media (max-width: 900px) {
            #heartsDisplay .heart { width: 18px; height: 18px; }
        }
        #startMenu {
            border-radius: 0;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #menuBackground {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #5c94fc, #1a3b7a);
            overflow: hidden;
        }
        .stars { position: absolute; width: 100%; height: 100%; }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 100px;
            animation: floatCloud 20s linear infinite;
        }
        @keyframes floatCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(1100px); }
        }
        #menuContent {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: white;
        }
        .game-title {
            font-size: 64px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 4px 4px 0 #7a4a12, 8px 8px 0 rgba(0,0,0,0.3), 0 0 40px rgba(255,204,0,0.3);
            letter-spacing: 4px;
            margin-bottom: 5px;
            animation: titleBounce 3s ease-in-out infinite;
        }
        @keyframes titleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }
        .title-icon {
            font-size: 50px;
            display: inline-block;
            animation: spinIcon 8s linear infinite;
        }
        @keyframes spinIcon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .subtitle {
            font-size: 22px;
            background: rgba(0,0,0,0.35);
            padding: 8px 32px;
            border-radius: 50px;
            margin: 8px 0 16px 0;
            border: 2px solid rgba(255,255,255,0.15);
            letter-spacing: 2px;
            font-weight: 300;
        }
        .subtitle span { color: #ffd700; font-weight: bold; }
        .controls-box {
            background: rgba(0,0,0,0.4);
            padding: 14px 28px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 8px 0 24px 0;
            max-width: 550px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .controls-box p { font-size: 15px; color: #d0e0ff; line-height: 2; margin: 0; }
        .controls-box kbd {
            background: rgba(255,255,255,0.15);
            padding: 3px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: inherit;
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
        }
        .controls-box .warning { color: #ffb3b3; font-size: 13px; }
        .controls-box .warning kbd { color: #ff6b6b; border-color: #ff6b6b; }
        #startButton {
            font-family: inherit;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #e8302a, #cc2222);
            border: none;
            border-radius: 20px;
            padding: 16px 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #7a1a17, 0 8px 30px rgba(232,48,42,0.4);
            transition: all 0.15s ease;
            letter-spacing: 2px;
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 0 #7a1a17, 0 8px 30px rgba(232,48,42,0.4); }
            50% { box-shadow: 0 8px 0 #7a1a17, 0 8px 50px rgba(232,48,42,0.8); }
        }
        #startButton:hover { transform: translateY(-3px) scale(1.03); }
        #startButton:active { transform: translateY(6px); box-shadow: 0 2px 0 #7a1a17; }

        #touchControls {
            position: absolute;
            bottom: 3%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 3%;
            box-sizing: border-box;
            z-index: 5;
            pointer-events: none;
            user-select: none;
        }
        #touchMove, #touchActions {
            display: flex;
            gap: 18px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            border: none;
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .ctrl-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }
        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: scale(0.75);
            filter: brightness(1.3);
        }
        @media (max-width: 900px) {
            .ctrl-btn { width: 90px; height: 90px; }
        }
        .mushroom-deco {
            position: absolute;
            font-size: 45px;
            opacity: 0.3;
            animation: floatMushroom 4s ease-in-out infinite;
        }
        @keyframes floatMushroom {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        .mushroom-deco:nth-child(1) { bottom: 20px; left: 30px; animation-delay: 0s; }
        .mushroom-deco:nth-child(2) { bottom: 20px; right: 30px; animation-delay: 1s; }
        .mushroom-deco:nth-child(3) { top: 20px; left: 30px; animation-delay: 2s; font-size: 32px; }
        .mushroom-deco:nth-child(4) { top: 20px; right: 30px; animation-delay: 3s; font-size: 32px; }
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 100% 100% 0 0 / 30% 30% 0 0;
            animation: waveMove 8s linear infinite;
        }
        .wave:nth-child(2) {
            bottom: -10px;
            opacity: 0.5;
            animation-duration: 6s;
            animation-delay: -2s;
            height: 40px;
        }
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
